[project]
name = "painel-saude"
version = "0.1.0"
description = "Painel de saúde local com dados do Apple Health e do Zepp, em um único HTML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabricio Macias" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
